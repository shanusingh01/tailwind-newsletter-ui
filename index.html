<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <link rel="stylesheet" href="style.css">
    <title>Tailwind CSS</title>
</head>
<body>
    <div class="mt-20 mx-52 flex flex-wrap rounded-lg border-2 border-black">
        <!-- quote container -->
        <div class="w-full bg-gradient-to-t from-sky-500 to-indigo-500 h-24 text-white flex justify-center items-center font-bold text-xl rounded-t">News you can Trust</div>
        <!-- content container -->
        <div class="text-center mt-6 w-full ">
            <h3 class="text-lg font-semibold">Stay up to date with the latest!</h3>
            <p>Subscribe to our newsletter for the latest news straight into your inbox.</p>
            <form class="flex flex-wrap">
                <input class="w-full mx-52 bg-slate-200 text-center rounded placeholder: text-sm my-4 py-2 " placeholder="your@email.com" />
                <button class="bg-blue-500 text-white w-full mx-52 py-2 rounded-full">Subscribe Now</button>
            </form>
            <p class="mt-6 my-6 text-sm">We value your privacy</p>
        </div>
    </div>
</body>
</html>
